<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    {{ $img := .Resources.GetMatch "page*" }}
    {{ if $img }}
      {{ $og_img := $img.Fill "1200x630 q70 jpg" }}
      <meta property="og:image" content="{{ $og_img.Permalink }}">
      <meta name="image" content="{{ $og_img.Permalink }}">
      <meta name="twitter:image" content="{{ $og_img.Permalink }}">
      <meta name="twitter:card" content="summary_large_image">
    {{ else }}
      <meta name="twitter:card" content="summary">
    {{ end }}
    <meta property="og:title" content="{{ .Title }} | {{ site.Title }}">
    <meta name="name" content="{{ .Title }} | {{ site.Title }}">
    <meta name="twitter:title" content="{{ .Title }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
    {{ $summary := .Description | default .Summary | plainify | truncate 160 }}
    <meta name="description" content="{{ if .IsHome }}Rafael 4 Comics - Indie Sci-Fi/Fantasy Comics From a Brazilian Author{{ else }}{{ $summary }}{{ end }}">
    <meta property="og:description" content="{{ $summary }}">
    <meta name="twitter:description" content="{{ $summary }}">

    <link rel="profile" href="http://gmpg.org/xfn/11">
    <link href="mailto:victorrafaelpereiraalves0202@gmail.com" rel="me">
    <link rel="alternate" type="application/sitemap+xml" title="Sitemap" href="/sitemap.xml">
    <link rel="webmention" href="https://webmention.io/rafa4comics.netlify.app/webmention" />

    {{ block "head" . }}
    {{ end }}

<style>
body { max-width: 900px; margin: 0 auto; padding: 0 1rem; font-family: sans-serif; background: #1a1a1a; color: #eee; line-height: 1.6; }
img { max-width: 100%; height: auto; display: block; }
.comic-nav { display: flex; justify-content: space-between; padding: 2rem 0; }
a { color: #00ffcc; text-decoration: none; border-bottom: 1px dotted transparent; }
a:hover { border-bottom-color: #00ffcc; }
footer { margin-top: 4rem; padding: 2rem 0; border-top: 1px solid #333; font-size: 0.9rem; }
</style>

    <meta name="google-site-verification" content="EhLlP5eAqwGihX9DZRwGECFJrUmv2NwhxN_EXh8po9w" />
  </head>

  <body>
    {{ block "main" . }}
    {{ end }}
    <footer>
      &copy; 2026 Rafael 04th
    </footer>
  </body>
</html>
