{{ define "head" }}
  <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="../index.xml">
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ComicStory",
    "name": "{{ .Title }}",
    "headline": "{{ .Description }}",
    "datePublished": "{{ .Date.Format "2006-01-02" }}",
    "author": {
      "@type": "Person",
      "name": "Rafael 04th",
      "url": "{{ site.BaseURL }}"
    },
    {{- with .Params.genres }}
    "genre": {{ . | jsonify }},{{ end }}
    "isPartOf": {
      "@type": "ComicSeries",
      "name": "{{ .Parent.Title }}",
      "description": "{{ .Parent.Description }}",
      "url": "{{ .Parent.Permalink }}"
    },
    {{ $image := .Resources.GetMatch "page*" -}}
    {{ if $image -}}
    "image": "{{ $image.Permalink }}",
    {{- end }}
    "character": [
      {{ range $i, $e := .Params.characters }}{{ if $i }},{{ end }}{
        "@type": "Person",
        "name": "{{ $e }}"
      }{{ end }}
    ]
  }
  </script>
{{ end }}
{{ define "main" }}
<main>
<article class="h-entry">
  <header>
    <h1 class="p-name">{{ .Title }}</h1>
    {{ with .Date }}
    <time class="dt-published" datetime="{{ .Format "2006-01-02T15:04:05Z07:00" }}">
      {{ .Format "January 2, 2006" }}
    </time>
    {{ end }}
  </header>

  <figure class="comic-display">
    {{ $image := .Resources.GetMatch "page*" }}
    {{ if $image }}
      {{ $tiny := $image.Resize "500x webp" }}
      {{ $small := $image.Resize "800x webp" }}
      {{ $medium := $image.Resize "1200x webp" }}
      {{ $large := $image.Process "webp" }}
      <img src="{{ $large.RelPermalink }}"
           srcset="{{ $tiny.RelPermalink }} 500w, {{ $small.RelPermalink }} 800w, {{ $medium.RelPermalink }} 1200w, {{ $large.RelPermalink }} {{ $large.Width }}w"
           sizes="(max-width: 900px) 100vw, 900px"
           alt="{{ .Params.alt_text | default .Title }}"
           width="{{ $large.Width }}"
           height="{{ $large.Height }}"
           class="u-photo"
           fetchpriority="high"
           loading="eager">
    {{ end }}
  </figure>

  <nav class="comic-nav" aria-label="Comic navigation">
    <div>
    {{ if .PrevInSection }}
      <a href="{{ .PrevInSection.Permalink }}" rel="prev">« Previous</a>
    {{ end }}
    </div>

    <a href="../index.html">Archive</a>

    <div>
    {{ if .NextInSection }}
      <a href="{{ .NextInSection.Permalink }}" rel="next">Next »</a>
    {{ end }}
    </div>
  </nav>

  <footer>
    <a href="../index.xml" rel="alternate" type="application/xml+rss">Subscribe to RSS Feed</a>
    {{ partial "webmentions.html" . }}
  </footer>
<main>
{{ end }}
