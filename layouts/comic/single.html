{{ define "head" }}
  <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="../index.xml">
{{ end }}
{{ define "main" }}
<main>
<article class="h-entry">
  <header>
    <h1 class="p-name">{{ .Title }}</h1>
    {{ with .Date }}
    <time class="dt-published" datetime="{{ .Format "2006-01-02T15:04:05Z07:00" }}">
      {{ .Format "January 2, 2006" }}
    </time>
    {{ end }}
  </header>

  <figure class="comic-display">
    {{ $image := .Resources.GetMatch "page*" }}
    {{ $webp := $image.Process "webp" }}
    <img src="{{ $webp.RelPermalink }}"
         alt="{{ .Params.alt_text | default .Title }}"
         width="{{ $webp.Width }}"
         height="{{ $webp.Height }}"
         class="u-photo"
         fetchpriority="high"
         loading="eager">
  </figure>

  <nav class="comic-nav" aria-label="Comic navigation">
    <div>
    {{ if .PrevInSection }}
      <a href="{{ .PrevInSection.Permalink }}" rel="prev">« Previous</a>
    {{ end }}
    </div>

    <a href="../index.html">Archive</a>

    <div>
    {{ if .NextInSection }}
      <a href="{{ .NextInSection.Permalink }}" rel="next">Next »</a>
    {{ end }}
    </div>
  </nav>

  <footer>
    <a href="../index.xml" rel="alternate" type="application/xml+rss">Subscribe to RSS Feed</a>
  </footer>
<main>
{{ end }}
